global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["172.31.5.124:9100"]
      - targets: ["172.31.43.104:9100"]
      - targets: ["172.31.7.53:9100"]
      - targets: ["172.31.41.100:9100"]

  - job_name: "kube-state-metrics"
    static_configs:
      - targets: ["172.31.41.100:30081"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["172.31.7.53:8080"]
      - targets: ["172.31.41.100:8080"]
