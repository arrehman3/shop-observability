[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File /etc/fluent-bit/parsers.conf

[INPUT]
    Name         forward
    Listen       127.0.0.1
    Port         24224
    Tag          shop.nginx

[INPUT]
    Name              systemd
    Tag               host.systemd
    DB                /var/lib/fluent-bit/systemd.db
    Read_From_Tail    On

[FILTER]
    Name          parser
    Match         shop.nginx
    Key_Name      log
    Parser        nginx_json
    Reserve_Data  On
    Preserve_Key  Off

[OUTPUT]
    Name                es
    Match               shop.nginx
    Host                172.31.32.77
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     shop-nginx
    Suppress_Type_Name  On

[OUTPUT]
    Name                es
    Match               host.systemd
    Host                172.31.32.77
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     shop-systemd
    Suppress_Type_Name  On
