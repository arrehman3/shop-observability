apiVersion: v1
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/*fluent-bit*.log
        Tag               kube.var.log.containers.*
        multiline.parser  cri
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off

    [FILTER]
        Name               modify
        Match              kube.*
        Remove             time
        Remove             timestamp
    [OUTPUT]
        Name                es
        Match               kube.*
        Host                172.31.32.77
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     shop-kubernetes
        Suppress_Type_Name  On
        Retry_Limit         False
kind: ConfigMap
metadata:
